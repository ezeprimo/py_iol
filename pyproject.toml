[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyiol"
version = "0.1.0"
description = "Cliente Python para la API de Invertir Online"
authors = [
    {name = "Ezequiel Primon", email = "ezeprimo@gmail.com"},
]
readme = "README.md"
license = {file = "LICENCE"}
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
    "cachetools>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyiol-client"
version = "0.1.0"
description = "Cliente Python para la API de Invertir Online"
authors = [
    {name = "Ezequiel Primon", email = "ezeprimo@gmail.com"},
]
readme = "README.md"
license = {file = "LICENCE"}
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
    "cachetools>=5.0.0",
]
keywords = [
    "iol",
    "invertir online",
    "trading",
    "argentina",
    "api",
    "stocks",
    "finance",
    "investment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.4.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/ezeprimo/py_iol"
Repository = "https://github.com/ezeprimo/py_iol"
"Bug Tracker" = "https://github.com/ezeprimo/py_iol/issues"
Documentation = "https://github.com/ezeprimo/py_iol/tree/master/doc"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.git",
    "/doc",
    "/xdoc",
    "/.env",
    "/.env.*",
]

[tool.hatch.build.targets.wheel]
packages = ["pyIol"]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.4.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

# Ruff configuration
[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
]

[tool.ruff.lint.isort]
known-first-party = ["pyIol"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
